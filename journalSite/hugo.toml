baseURL = "https://plan-b.foundation/journal/"
title = "Plan-B Journal"
locale = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[module]
  replacements = "github.com/LuganoPlanB/journal -> ../.."
  [[module.imports]]
    path = "github.com/LuganoPlanB/journal"

[params]
  journal = true
  description = "Articles and issues of the Plan-B Journal."
  # hotcrpURL = "https://your-submission-server.example/"

[outputs]
  home = ["html", "rss", "llms", "llmsfull"]

[[menus.main]]
  name = "Issues"
  pageRef = "/issues"
  weight = 10
[[menus.main]]
  name = "For authors"
  pageRef = "/authors"
  weight = 20
[[menus.main]]
  name = "People"
  pageRef = "/people"
  weight = 30
[[menus.main]]
  name = "Journal club"
  pageRef = "/journal-club"
  weight = 40
[[menus.main]]
  name = "News"
  pageRef = "/news"
  weight = 50
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 60
