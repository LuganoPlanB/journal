name: Check and publish journal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: journal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failing hugo before | tee fails the step
    env:
      HUGO_VERSION: 0.170.0
      DART_SASS_VERSION: 1.108.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script tests
        run: |
          pip install -r requirements.txt
          python3 -m unittest discover tests

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Hugo and Dart Sass
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          curl -sSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$HOME"
          echo "$HOME/dart-sass" >> "$GITHUB_PATH"
      - name: Build exampleSite
        working-directory: exampleSite
        run: |
          npm install --no-audit --no-fund
          # fail on errors and on warnings, except the expected stand-in one
          hugo --logLevel warn 2>&1 | tee build.log
          ! grep -E '^(ERROR|WARN)' build.log | grep -v 'stand-in images'
      - name: Check journal publishing
        run: python3 -m unittest discover -s integration -v

      - name: Read GitHub Pages URL
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build public journal
        working-directory: journalSite
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [[ -n "$BASE_URL" ]]; then
            hugo --panicOnWarning --baseURL "${BASE_URL%/}/"
          else
            hugo --panicOnWarning
          fi

      - name: Upload public journal
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: journalSite/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
