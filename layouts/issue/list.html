{{ define "main" }}
  <a href="{{ .Parent.RelPermalink }}">All issues</a>
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>{{ end }}
  {{ .Content }}
  {{ partial "journal/contents.html" . }}
  {{ with .OutputFormats.Get "papersjson" }}<p><a href="{{ .RelPermalink }}">Download article metadata (JSON)</a></p>{{ end }}
{{ end }}
